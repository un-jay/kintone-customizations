name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm install

            - run: npm run format:check

            - run: npm run lint

    validate-manifests:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Download the official manifest schema
              run: |
                  curl -sL -o manifest-schema.json \
                    "https://raw.githubusercontent.com/kintone/js-sdk/%40kintone/plugin-manifest-validator%4011.1.0/packages/plugin-manifest-validator/manifest-schema.json"

            - name: Validate plugin manifest.json files against the official schema
              run: |
                  npx --yes ajv-cli@5 validate \
                    -s manifest-schema.json \
                    -d "plugins/*/src/manifest.json" \
                    --strict=false

            - name: Pack each plugin with a throwaway signing key
              run: |
                  for dir in plugins/*/; do
                    (
                      cd "$dir"
                      npx --yes @kintone/cli plugin keygen -o ./ci-throwaway.ppk
                      npx --yes @kintone/cli plugin pack \
                        --input ./src/manifest.json \
                        --output ./dist/plugin.zip \
                        --private-key ./ci-throwaway.ppk
                    )
                  done
